  <text x="36" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8A93A3">One API key reaches every major model through an OpenAI-compatible endpoint. The credits that pay for it come from</text>
